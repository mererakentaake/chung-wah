<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F2C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Only used by @codetrix-studio/capacitor-google-auth's web fallback
         (i.e. testing in a plain browser via `npm run dev`) — the actual
         Android build reads serverClientId from capacitor.config.ts instead.
         %VITE_GOOGLE_WEB_CLIENT_ID% is filled in by Vite from .env.local at
         build time. -->
    <meta name="google-signin-client_id" content="%VITE_GOOGLE_WEB_CLIENT_ID%" />
    <title>Chung Wah E-School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
